[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-crossover-terminal"
version = "1.0.0"
description = "Modular market-data and technical-analysis terminal"
requires-python = ">=3.11"

dependencies = ["numpy>=1.26", "pandas>=2.1", "pytz>=2024.1", "websockets>=12.0,<17", "python-dotenv>=1.0", "t-tech-investments @ https://github.com/Invest-SDK/invest-python/raw/refs/heads/master/t_tech_investments-1.51.0-py3-none-any.whl"]

[tool.setuptools.package-data]
ma_terminal = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]

[tool.setuptools.packages.find]
where = ["src"]
